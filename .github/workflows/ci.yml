name: Automated CI Pipeline (Track SE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smart_crm_db
          MYSQL_USER: crm_user
          MYSQL_PASSWORD: crm_password123
          MYSQL_ROOT_PASSWORD: root_password123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Phân quyền chạy script Maven Wrapper
        run: chmod +x mvnw

      - name: Chạy Bộ kiểm thử tự động (Automated Tests)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: smart_crm_db
          MYSQL_USER: crm_user
          MYSQL_PASSWORD: crm_password123
          LOG_LEVEL: INFO
          JWT_SECRET: chuoi_bi_mat_32_ky_tu_sample
        run: ./mvnw clean test

      - name: Kiểm tra Đóng gói Docker Multi-stage
        run: docker build -t smartcrm-app:ci .
