<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Lỗi Kết Nối Hệ Thống | Smart CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #f8fafc !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .error-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            max-width: 580px;
            width: 100%;
            margin: auto;
            padding: 2.5rem;
            text-align: center;
        }
        .error-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #fee2e2;
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Header bar tối giản không phụ thuộc session hay DB -->
    <header class="crm-top-bar">
        <a th:href="@{/}" class="crm-brand">
            Smart CRM
        </a>
    </header>

    <div class="container py-5 d-flex flex-grow-1 align-items-center justify-content-center">
        <div class="error-card">
            <div class="error-icon-box">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h2 class="fw-bold text-dark mb-2">500 - Lỗi Kết Nối Hệ Thống</h2>
            <p class="text-secondary mb-4" style="font-size: 0.95rem;">
                Hệ thống đang gặp sự cố tạm thời hoặc gián đoạn kết nối. Vui lòng thử lại sau ít phút.
            </p>

            <div class="alert alert-danger text-start py-3 px-3 mb-4" style="font-size: 0.875rem;">
                <div class="fw-bold mb-2 text-danger">
                    <i class="bi bi-shield-exclamation me-1"></i> Thông báo sự cố
                </div>
                <div class="mb-2 text-dark">
                    Máy chủ không thể hoàn thành yêu cầu do sự cố kết nối nội bộ hoặc cơ sở dữ liệu tạm thời gián đoạn.
                </div>
                <div class="pt-2 border-top border-danger-subtle text-secondary" style="font-size: 0.8125rem;">
                    Mã tra cứu sự cố: <strong class="text-danger" id="errorRequestId" th:text="${requestId}">N/A</strong>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                <button type="button" class="btn btn-crm-primary px-4 py-2" onclick="window.location.reload()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Thử lại
                </button>
                <a th:href="@{/}" class="btn btn-crm-secondary px-3 py-2">
                    <i class="bi bi-house me-1"></i> Về trang chủ
                </a>
            </div>
        </div>
    </div>

</body>
</html>
