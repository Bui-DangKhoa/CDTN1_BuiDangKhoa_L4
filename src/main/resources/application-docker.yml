server:
  port: ${APP_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true
      enabled: true

spring:
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/smart_crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:crm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:crm_password123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

logging:
  level:
    root: INFO
    "[com.mekongmobile.smartcrm]": INFO
    "[org.hibernate.SQL]": WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

