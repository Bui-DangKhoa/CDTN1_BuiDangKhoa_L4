server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      force-response: true
      enabled: true

spring:
  application:
    name: smart-crm-technician-scheduling

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQL_HOST:localhost}}:${DB_PORT:${MYSQL_PORT:3306}}/${DB_NAME:${MYSQL_DATABASE:smart-crm-technician-scheduling}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:smart-crm-technician-scheduling}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:12345}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    "[com.mekongmobile.smartcrm]": ${APP_LOG_LEVEL:DEBUG}
    "[org.hibernate.SQL]": ${SQL_LOG_LEVEL:WARN}

app:
  jwt:
    secret: ${JWT_SECRET:chuoi_bi_mat_32_ky_tu_sample}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
