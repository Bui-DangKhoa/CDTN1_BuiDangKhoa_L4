services:
  db:
    image: mysql:8.0
    container_name: smartcrm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_crm_db}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crm_password123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seeds/data-demo.sql:/docker-entrypoint-initdb.d/02-data-demo.sql:ro
      - ./seeds/auth_data.sql:/docker-entrypoint-initdb.d/03-auth-data.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartcrm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcrm-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-smart_crm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-crm_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-crm_password123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - smartcrm-network

volumes:
  db_data:

networks:
  smartcrm-network:
    driver: bridge
